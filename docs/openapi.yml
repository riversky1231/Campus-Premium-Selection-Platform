components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Register:
      type: object
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9_]{4,32}$
        password:
          type: string
          minLength: 8
          maxLength: 64
        nickname:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - username
      - password
      - nickname
      additionalProperties: false
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
      additionalProperties: false
    WxLogin:
      type: object
      properties:
        code:
          type: string
      required:
      - code
      additionalProperties: false
    Nickname:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - nickname
      additionalProperties: false
    Address:
      type: object
      properties:
        recipient:
          type: string
          maxLength: 40
        phone:
          type: string
          pattern: ^[0-9+ -]{6,20}$
        detail:
          type: string
          maxLength: 250
      required:
      - recipient
      - phone
      - detail
      additionalProperties: false
    Money:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,80}$
        userId:
          type: integer
          minimum: 1
        amount:
          type: number
          multipleOf: 0.01
          minimum: 0.01
          maximum: 100000
      required:
      - requestId
      - userId
      - amount
      additionalProperties: false
    Enabled:
      type: object
      properties:
        enabled: &id001
          type: boolean
      required:
      - enabled
      additionalProperties: false
    Category:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
      required:
      - name
      additionalProperties: false
    Product:
      type: object
      properties:
        categoryId: &id002
          type: integer
          minimum: 1
        name: &id003
          type: string
          minLength: 1
          maxLength: 100
        description: &id004
          type: string
          maxLength: 1000
        price: &id005
          type: number
          multipleOf: 0.01
          minimum: 0.01
        onSale: *id001
      required:
      - categoryId
      - name
      - description
      - price
      - onSale
      additionalProperties: false
    Stock:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,80}$
        productId:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
      required:
      - requestId
      - productId
      - quantity
      additionalProperties: false
    Cart:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 99
      required:
      - quantity
      additionalProperties: false
    Order:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,80}$
        addressId:
          type: integer
          minimum: 1
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            properties:
              productId:
                type: integer
                minimum: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 99
            required:
            - productId
            - quantity
            additionalProperties: false
      required:
      - requestId
      - addressId
      - items
      additionalProperties: false
    Redeem:
      type: object
      properties:
        pickupCode:
          type: string
          pattern: ^[A-F0-9]{16}$
      required:
      - pickupCode
      additionalProperties: false
    NewProduct:
      type: object
      properties:
        categoryId: *id002
        name: *id003
        description: *id004
        price: *id005
        onSale: *id001
        stock:
          type: integer
          minimum: 0
      required:
      - categoryId
      - name
      - description
      - price
      - onSale
      - stock
      additionalProperties: false
