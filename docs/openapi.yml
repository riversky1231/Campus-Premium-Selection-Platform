        '400':
          description: 参数错误
        '401':
          description: 未登录或凭证无效
        '403':
          description: 权限不足
        '404':
          description: 不存在或不属于当前用户
        '409':
          description: 业务状态冲突
        '429':
          description: 请求过于频繁
        '503':
          description: 依赖不可用
      security: []
      requestBody:
